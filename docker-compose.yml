# Arr stack: Prowlarr, Sonarr, Radarr, qBittorrent, FlareSolverr, Plex, Seerr, Homepage
# All services share one network (arr-net) and reach each other by container name,
# e.g. http://qbittorrent:8080, http://prowlarr:9696, http://flaresolverr:8191
#
# Folder layout (everything under ONE parent so hardlinks work):
#   ./data/torrents            <- qBittorrent downloads
#   ./data/media/tv            <- Sonarr root folder / Plex TV library
#   ./data/media/movies        <- Radarr root folder / Plex Movies library
#   ./config/<app>             <- per-app settings
#
# To store media on an external drive, set DATA_DIR in the .env file,
# e.g. DATA_DIR=/Volumes/MyDrive/data
#
# The setup scripts write .env (PUID, PGID, TZ, qBittorrent login, Homepage hosts).

name: arr-stack

x-common: &common
  restart: unless-stopped
  networks:
    - arr-net
  environment: &common-env
    PUID: ${PUID:-501}   # macOS default user id
    PGID: ${PGID:-20}    # macOS "staff" group
    TZ: ${TZ:-Asia/Jerusalem}

services:
  flaresolverr:
    <<: *common
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
      LOG_LEVEL: info
    ports:
      - "8191:8191"

  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    depends_on:
      - flaresolverr

  qbittorrent:
    <<: *common
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    volumes:
      - ./config/sonarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - "8989:8989"
    depends_on:
      - prowlarr
      - qbittorrent

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    volumes:
      - ./config/radarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - "7878:7878"
    depends_on:
      - prowlarr
      - qbittorrent

  plex:
    <<: *common
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      <<: *common-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}   # optional, get one at https://plex.tv/claim (valid 4 min)
    volumes:
      - ./config/plex:/config
      - ${DATA_DIR:-./data}/media:/data/media
    ports:
      - "32400:32400"

  # Discovery and requests. Runs as UID/GID 1000 inside the container, so on Linux
  # the setup script gives ./config/seerr to 1000:1000.
  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ:-Asia/Jerusalem}
      PORT: 5055
      LOG_LEVEL: info
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    depends_on:
      - sonarr
      - radarr

  # Dashboard. Its config (./config/homepage) is generated by the setup script.
  # HOMEPAGE_ALLOWED_HOSTS must list every host:port you open it from.
  homepage:
    <<: *common
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      <<: *common-env
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3000,127.0.0.1:3000}
    volumes:
      - ./config/homepage:/app/config
    ports:
      - "3000:3000"

networks:
  arr-net:
    name: arr-net
    driver: bridge
